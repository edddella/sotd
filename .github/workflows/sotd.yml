name: Song of the Day

on:
  # Main trigger: cron-job.org calls GitHub's API every 5 minutes to start this.
  # Those starts happen within seconds, unlike GitHub's own schedule below.
  workflow_dispatch: {}
  # Backup only. GitHub's scheduler often runs hours late, so don't rely on it.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write   # lets the job commit state.json back to the repo

concurrency:
  group: song-of-the-day
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # always grab the newest state.json, even if this run sat in a queue

      - name: Check playlist and post new songs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TIMEZONE: America/Los_Angeles
        run: python3 sotd.py

      - name: Save state
        if: always()
        run: |
          git config user.name "song-of-the-day-bot"
          git config user.email "song-of-the-day-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update song of the day state"
          git pull --rebase --quiet
          git push --quiet
